# Break-it-once, weekly: every guard in test/mutations/*.json is broken in turn and must be caught
# by a test (scripts/mutate.py). A new survivor, a list entry the code no longer matches, or a known
# survivor that is now caught fails the run (D-009). About 40 minutes; also runnable by hand.
name: Mutations
on:
  schedule: [{ cron: "17 4 * * 1" }]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: mutations, cancel-in-progress: false }
jobs:
  mutations:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      # Socket Firewall (D-024, as better-auth-saml-idp's D-073): blocks packages Socket has confirmed as malware before they download.
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with: { mode: firewall-free }
      - run: sfw pnpm install --frozen-lockfile
      - run: python3 scripts/mutate.py test/mutations/core.json test/mutations/receiver.json test/mutations/issuer.json
