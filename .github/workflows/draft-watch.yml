# Weekly: fails when the IETF has a newer revision of the ID-JAG draft than SUPPORTED_DRAFT, so a draft
# change (claims, URNs, rules) is noticed without anyone watching the datatracker (scripts/draft-watch.mjs).
name: Draft watch
on:
  schedule: [{ cron: "41 6 * * 1" }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: node scripts/draft-watch.mjs
