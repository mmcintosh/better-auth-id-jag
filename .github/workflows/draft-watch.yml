# Weekly: fails when the IETF has a newer revision of the ID-JAG draft than SUPPORTED_DRAFT, so a draft
# change (claims, URNs, rules) is noticed without anyone watching the datatracker (scripts/draft-watch.mjs);
# when Microsoft Entra's release notes first mention ID-JAG (scripts/entra-watch.mjs); and when an upstream Better
# Auth change this package depends on lands, or a 1.8 appears on npm (scripts/upstream-watch.mjs).
name: Draft watch
on:
  schedule: [{ cron: "41 6 * * 1" }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: node scripts/draft-watch.mjs
  entra:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: node scripts/entra-watch.mjs
  upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      # The token only raises GitHub's rate limit for the public reads (contents: read).
      - run: node scripts/upstream-watch.mjs
        env: { GITHUB_TOKEN: "${{ github.token }}" }
