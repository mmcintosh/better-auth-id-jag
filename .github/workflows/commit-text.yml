# Checks the text of a pull request, or of a push to main: every commit's message, author and committer, and the PR's
# title and description, against the patterns below. A required check on main (ruleset protect-main).
name: Commit text
on:
  push: { branches: [main] }
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions: { contents: read }
jobs:
  commit-text:
    runs-on: ubuntu-24.04
    permissions: { contents: read, pull-requests: read }
    steps:
      - name: Check titles, descriptions, commit messages, authors and committers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          names='claude|anthropic|copilot|openai|chatgpt|codex|gemini|bard|cursor|codeium|windsurf|devin|aider|tabnine|codewhisperer|amazon ?q|sweep|mutable\.ai|grok|greptile|coderabbit|qodo|sourcery|ellipsis'
          text_pattern="co-authored-by:.*($names)|generated (with|by) \[?($names)|noreply@anthropic\.com|claude\.(ai|com)/code|chatgpt\.com|copilot-swe-agent"
          people_pattern="($names)"
          # Each commit as: message, then "author: name <email>" and "committer: name <email>" lines.
          jq_commit='"\(.commit.message)\nauthor: \(.commit.author.name) <\(.commit.author.email)> \(.author.login // "")\ncommitter: \(.commit.committer.name) <\(.commit.committer.email)> \(.committer.login // "")"'
          if [ "$EVENT" = pull_request ]; then
            commits=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate --jq ".[] | $jq_commit")
            text=$(printf '%s\n%s\n%s\n' "$PR_TITLE" "$PR_BODY" "$commits")
          elif [ -n "${BEFORE//0/}" ] && gh api "repos/$REPO/compare/$BEFORE...$AFTER" --silent 2>/dev/null; then
            text=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq ".commits[] | $jq_commit")
          else
            text=$(gh api "repos/$REPO/commits/$AFTER" --jq "$jq_commit")
          fi
          bad=0
          if hits=$(printf '%s\n' "$text" | grep -inE "$text_pattern"); then echo "::error::Commit text not accepted:"; printf '%s\n' "$hits"; bad=1; fi
          if hits=$(printf '%s\n' "$text" | grep -iE '^(author|committer): ' | grep -iE "$people_pattern"); then echo "::error::Commit author or committer not accepted:"; printf '%s\n' "$hits"; bad=1; fi
          [ "$bad" = 0 ] && echo "OK." || exit 1
