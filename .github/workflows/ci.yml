# Tested at the peer range's minimum and the latest 1.7.x, on the oldest and newest Node LTS, each on
# Node and inside workerd (vitest's two projects). Runners are pinned to ubuntu-24.04 (not
# ubuntu-latest), and every action to a SHA. Adapters, runtimes and the Workers example join when
# there is code for them (plan §4).
name: CI
on:
  push: { branches: [main] }
  pull_request:
# Least privilege: jobs only read the repository (OpenSSF Scorecard: Token-Permissions).
permissions: { contents: read }
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        better-auth: ["1.7.5", "latest-1.7"]
        node: [24]
        include:
          - { better-auth: "1.7.5", node: 22 } # oldest Node LTS still maintained
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: scripts/use-better-auth.sh ${{ matrix.better-auth }}
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test # Node (node:sqlite) and workerd (D1)
      - run: pnpm build

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 git /repo --no-banner --redact -c /repo/.gitleaks.toml
