name: Feature request
description: Something the issuer or the receiver should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and which IdP, client, MCP server or part of the draft needs it.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried instead
