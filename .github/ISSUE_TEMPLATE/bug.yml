name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Stop here and [report it privately](https://github.com/mmcintosh/better-auth-id-jag/security/advisories/new).
        Never paste private keys, client secrets, real tokens, session cookies or real users' data. Replace them with throwaway values.
  - type: dropdown
    id: side
    attributes:
      label: Which side
      options: ["Issuer (idJagIssuer)", "Receiver (idJagGrant)", Both, "Client plugin / admin API"]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
  - type: input
    id: reason
    attributes:
      label: Error and reason code
      description: The `error` the caller got, and the `reason` from the onRefused event or the idJagAudit table (e.g. `invalid_grant` / `wrong_audience`).
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Your idJagIssuer({...}) or idJagGrant({...}) options (secrets removed) and the requests you sent. A minimal repository is ideal.
      render: ts
    validations: { required: true }
  - type: textarea
    id: token
    attributes:
      label: The ID-JAG's header and claims, if relevant
      description: Decoded JSON only (header and payload), never the signed token, with personal data replaced.
      render: json
  - type: input
    id: versions
    attributes:
      label: Versions
      description: better-auth-id-jag (or commit), better-auth, and @better-auth/oauth-provider or @better-auth/mcp
      placeholder: "commit abc1234, better-auth 1.7.6"
    validations: { required: true }
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options: [Cloudflare Workers, Node, Other]
    validations: { required: true }
  - type: input
    id: database
    attributes:
      label: Database and adapter
      placeholder: "D1, PostgreSQL + Kysely, SQLite + Drizzle, …"
