# Secret scan over the full git history (CI job "secrets"). Allow-listed: the fixed Better Auth test
# secrets, spelled "<name>-secret-that-is-at-least-32-characters-long".
[extend]
useDefault = true

[allowlist]
description = "Test-only placeholders"
regexes = ['''[a-z]+-secret-that-is-at-least-32-characters-long''']
